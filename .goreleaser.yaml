# GoReleaser configuration for bombardier
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: bombardier
    main: .
    binary: bombardier
    env:
      - CGO_ENABLED=0
    # -s -w strip the symbol table; -X injects the release version into
    # the `version` variable in package main (see common.go).
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: bombardier
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto

# Post a notification to Slack after a successful release.
# Requires the SLACK_WEBHOOK environment variable (a Slack Incoming Webhook URL).
announce:
  slack:
    enabled: true
    channel: "#releases"
    username: "GoReleaser"
    icon_emoji: ":rocket:"
    message_template: ":tada: bombardier {{ .Tag }} has been released! Changelog & downloads: {{ .ReleaseURL }}"
